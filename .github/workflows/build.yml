name: Build CalamityShock

# Every push to main builds the plugin on GitHub and publishes the DLL three ways:
#   1. as a workflow artifact (Actions tab -> the run -> "CalamityShock");
#   2. on the 'release' branch, which holds nothing but CalamityShock.dll so a server
#      can `git pull` it straight into ServerPlugins/ (see README.md);
#   3. as a GitHub Release with the DLL attached, when you push a tag like v0.2.0.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build (Release)
        run: dotnet build -c Release -p:ContinuousIntegrationBuild=true

      - name: Upload the DLL as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalamityShock
          path: bin/Release/CalamityShock.dll
          if-no-files-found: error

      - name: Publish the DLL to the 'release' branch
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/publish-release-branch.sh

      - name: Attach the DLL to a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/Release/CalamityShock.dll \
            --repo "$GITHUB_REPOSITORY" --title "CalamityShock $GITHUB_REF_NAME" \
            --notes "Built by GitHub Actions from $GITHUB_SHA. Drop CalamityShock.dll into ServerPlugins/."
